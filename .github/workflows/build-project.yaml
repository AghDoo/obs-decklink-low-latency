name: Build Project
on:
  workflow_call:
    outputs:
      pluginName:
        description: Display name from the project build specification
        value: ${{ jobs.check-event.outputs.pluginName }}

jobs:
  check-event:
    name: Check GitHub Event Data
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Event Data
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package=false
          config=RelWithDebInfo

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                package=true
              fi
              ;;
            push)
              package=true
              if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta).+)?$ ]]; then
                config=Release
              fi
              ;;
            workflow_dispatch)
              package=false
              ;;
            schedule)
              package=true
              ;;
          esac

          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "config=${config}" >> "$GITHUB_OUTPUT"
          echo "commitHash=${GITHUB_SHA:0:9}" >> "$GITHUB_OUTPUT"
          echo "pluginName=$(jq -r '.displayName // .name' buildspec.json)" >> "$GITHUB_OUTPUT"

  windows-build:
    name: Build for Windows
    runs-on: windows-2025-vs2026
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read Build Specification
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($BuildSpec.name)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT

      - name: Build Plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ needs.check-event.outputs.package }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
